<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI 模拟面试 · 本地版</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body>

<div id="app"></div>

<!-- Token 额度耗尽弹窗 -->
<div id="quotaModal" class="auth-overlay" hidden>
    <div class="auth-card quota-card" role="dialog" aria-modal="true" aria-labelledby="quotaTitle">
        <h2 id="quotaTitle" class="authTitle">积分已用完</h2>
        <p id="quotaModalMsg" class="quota-msg">上传 JD、简历 / 笔记 / 项目文档，以及开始模拟面试都需要消耗积分。请联系管理员为账号充值后继续。</p>
        <p class="quota-sub">账号 <b id="quotaModalUser">—</b> · 当前余额 <b id="quotaModalRemain">0</b> 积分</p>
        <button type="button" id="btnQuotaOk" class="primary big">我知道了</button>
    </div>
</div>

<script th:src="@{/app.js}"></script>
</body>
</html>
