<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI 模拟面试 · 本地版</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<header class="topbar">
    <div class="brand">AI 模拟面试<span class="sub">贴 JD → 角色追问 → Critic 报告 + 错题本</span></div>
    <div class="conn">
        <span id="connDot" class="dot offline"></span>
        <span id="connText">未连接</span>
    </div>
</header>

<main class="layout">

    <!-- ======================= 左：准备区 ======================= -->
    <aside class="panel">
        <h2>1. 准备</h2>

        <div class="block">
            <label class="lb" for="jdText">岗位 JD（粘贴后点上传）</label>
            <textarea id="jdText" rows="6" placeholder="粘贴招聘 JD 原文…"></textarea>
            <div class="row">
                <input id="jdTag" type="text" placeholder="同类标签（可选，如 后端-美团）">
                <button id="btnJd" class="primary">上传 JD</button>
            </div>
            <div class="row">
                <select id="jdSelect" aria-label="已上传的 JD">
                    <option value="">— 选择已有 JD —</option>
                </select>
                <button id="btnRefreshJd" class="ghost">刷新</button>
            </div>
        </div>

        <div class="block">
            <label class="lb" for="resumeText">简历（md）</label>
            <textarea id="resumeText" rows="4" placeholder="# 张三&#10;Java 后端…"></textarea>
            <button id="btnResume" class="ghost">上传简历</button>
        </div>

        <div class="block">
            <label class="lb" for="docTitle">项目文档（标题 + 详解）</label>
            <input id="docTitle" type="text" placeholder="项目名，如 AI 情报">
            <textarea id="docText" rows="4" placeholder="项目详解：背景 / 我做的 / 难点 / 现状…"></textarea>
            <button id="btnDoc" class="ghost">上传项目文档</button>
        </div>

        <div class="block">
            <label class="lb" for="noteText">笔记（可选）</label>
            <textarea id="noteText" rows="3" placeholder="随手写的学习笔记，会进 RAG 语料"></textarea>
            <button id="btnNote" class="ghost">存笔记</button>
        </div>

        <div class="block">
            <span class="lb">面试官角色</span>
            <label class="chk"><input type="checkbox" class="roleChk" value="技术深挖官" checked> 技术深挖官</label>
            <label class="chk"><input type="checkbox" class="roleChk" value="项目质疑官"> 项目质疑官</label>
            <button id="btnStart" class="primary big">开始模拟面试</button>
        </div>

        <p id="tip" class="tip"></p>
    </aside>

    <!-- ======================= 中：面试区 ======================= -->
    <section class="panel main">
        <h2>2. 面试</h2>
        <div id="chat" class="chat">
            <p class="placeholder">左侧上传 JD 后点「开始模拟面试」，题目会通过 SSE 实时推过来。</p>
        </div>

        <div class="answer">
            <textarea id="answerText" rows="3" placeholder="你的回答（Ctrl + Enter 提交）" disabled></textarea>
            <div class="row">
                <button id="btnAnswer" class="primary" disabled>提交回答</button>
                <button id="btnEnd" class="warn" disabled>结束并出报告</button>
                <span id="stateText" class="state">未开始</span>
            </div>
        </div>
    </section>

    <!-- ======================= 右：报告 + 错题本 ======================= -->
    <aside class="panel side">
        <h2>3. Critic 报告</h2>
        <div id="report" class="report">
            <p class="placeholder">结束后这里出报告：匹配度、逐轮讲解、答崩点、表述问题、提醒。</p>
        </div>

        <h2>4. 错题本（间隔重复）</h2>
        <div class="row">
            <button id="btnWeak" class="ghost">刷新</button>
            <label class="chk"><input id="dueOnly" type="checkbox"> 只看今日到期</label>
        </div>
        <div id="weak" class="weak">
            <p class="placeholder">答崩的知识点会自动进这里，按 [1,3,7,15] 天阶梯排复习。</p>
        </div>
    </aside>

</main>

<script th:src="@{/app.js}"></script>
</body>
</html>
