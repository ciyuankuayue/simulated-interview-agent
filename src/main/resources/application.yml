server:
  port: 8080

spring:
  application:
    name: mock-interview-agent

  # ===== 本地默认：H2 内存库（免 Docker，验证 T1/T2/T3 编译 + 10 实体建表） =====
  # 走 MySQL 8（生产 / Docker 起得来时）用 profile `mysql`（先 docker compose up -d）：
  #   PowerShell（推荐）: $env:SPRING_PROFILES_ACTIVE="mysql"; .\mvnw.cmd clean spring-boot:run
  #   双 shell 通用（-D 整体加引号，PowerShell 不加引号会被拆参）:
  #                      .\mvnw.cmd clean spring-boot:run "-Dspring-boot.run.profiles=mysql"
  # ⚠️ 部署到生产必须显式加 prod profile，否则默认跑 H2 内存库（重启即清空，仅本地验证用）。
  datasource:
    url: jdbc:h2:mem:mock_interview;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop   # 内存库：启动建表、关闭即清；仅本地验证用
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.H2Dialect
  # R2-T0 D4：默认 profile（H2 create-drop）不跑 Flyway；仅 prod profile 启用。
  flyway:
    enabled: false

  # ---- Redis（指纹去重 / 会话缓存；redis 用 docker 起，down 不影响启动，用到才连） ----
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # ---- 静态资源缓存策略（T12） ----
  # no-cache 不是「不缓存」，而是「每次使用前必须回源验证」：浏览器带 If-Modified-Since，
  # 文件没变返 304（零传输），文件变了（如发布新版 app.js）立即拿到新内容。
  # 不配时浏览器走启发式强缓存，前端更新后用户不 Ctrl+F5 就一直跑旧 JS（门禁/报告修复都会被缓存吞掉）。
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true

# ---- LLM 密钥（NEVER 写死；统一从环境变量读，AGENTS.md Restrictions） ----
# 代码侧用 @ConfigurationProperties 绑定以下前缀（T5 建 LlmConfig）；本文件只放配置。
# 模型名已核实（官方 api-docs.deepseek.com 定价页）：
#   - 推荐 deepseek-flash（= DeepSeek-V4.1-Flash）；旧名 deepseek-v4-flash 已下线，
#     仍可调用但会被静默映射到 V4.1-Flash，故一律用 deepseek-flash
#   - deepseek-v4-pro 仍为旗舰推理档
# 思考模式开关（OpenAI 格式，默认开启）：请求体加 {"thinking":{"type":"enabled|disabled"}}，
#   强度用 reasoning_effort: low|high|max（默认 high）。
# ⚠️ 坑：请求一旦携带 tools，后续每轮必须完整回传上一轮 reasoning_content，否则 API 返 400。
deepseek:
  base-url: https://api.deepseek.com/v1
  api-key: ${DEEPSEEK_API_KEY:}          # 空默认：T2 不调 LLM，启动不报错；T5 调之前必须 set
  model-flash: deepseek-flash            # 追问：非思考模式（thinking.type=disabled）
  model-reasoner: deepseek-flash         # 判分/Critic：思考模式（thinking.type=enabled，默认即开）
  model-pro: deepseek-v4-pro             # 升级档：Flash 思考模式仍判不准时切换（决策 #1）
  timeout-ms: 60000
  max-tokens: 8192                       # 不卡 800（决策 #2）；判分/Critic 输出长，放宽；仍校验非空
  critic-max-tokens: 32768              # Critic 报告专用预算：思考模式下 max_tokens 限制 reasoning+content 总生成量，
                                        # 默认 8192 会被 reasoning 挤爆导致 JSON 截断（字段名写到一半被砍）。
                                        # V4.1 Flash 支持到 384K 输出，给 32768 留足 content 空间。
dashscope:
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api-key: ${DASHSCOPE_API_KEY:}         # 空默认：T2 不向量化，启动不报错；T4 之前必须 set
  embed-model: qwen3.7-text-embedding-flash
  # R3-2 通义千问对话（与 embedding 共用 base-url/key）。模型名迭代快，以百炼控制台实测为准；
  # chat-model-reasoner 必须实测支持 enable_thinking=true + response_format=json_object 组合。
  chat-model-fast: qwen3.8-flash          # 追问/JD 解析：非思考档
  chat-model-reasoner: qwen3.7-plus       # 判分/Critic：思考档

# ---- R1-1 JWT 配置 ----
# 生产必须显式设 jwt.secret（至少 32 字节）。空值时应用首次启动自动生成并打印到控制台，
# 但重启后失效（令牌签名变了，旧 token 全部无法验证，需要重新 login）。
jwt:
  secret: ${JWT_SECRET:}                  # 空=启动时自动生成（仅开发便利；生产必须显式设）
  expiry-ms: 86400000                     # 24 小时（24 * 60 * 60 * 1000）

# ---- R2 token 额度（PLATFORM 按 usage 实扣；BYOK 对话按真实用量比例收服务费；embedding 也计量） ----
app:
  interview:
    # New sessions use bounded Agent decisions; existing sessions without agent_state retain compatibility.
    agent-enabled: ${APP_INTERVIEW_AGENT_ENABLED:true}
    max-model-calls: 3
    max-tool-calls: 4
    max-output-tokens: 4096
    max-step-tokens: 64000
    max-step-millis: 60000
  # ---- R3-2 对话模型路由 ----
  llm:
    default-provider: deepseek            # 无用户上下文（测试/内部调用）时的默认对话厂商；登录用户按其 settings 走
  # ---- R4 向量索引（Lucene FSDirectory 持久化） ----
  rag:
    # 索引目录：相对路径基于进程工作目录解析为绝对路径；也可填绝对路径。
    # 环境变量 APP_RAG_INDEX_DIR 可覆盖（Docker 挂卷时指向 /app/data/rag-index）。
    index-dir: ${APP_RAG_INDEX_DIR:data/rag-index}
    dim: 1024                          # 通义 qwen embedding 维度；写入/查询统一 pad/截断到此长度
    # 启动时若四张资料表（resume_version/note/project_doc/real_interview_record）全空，
    # 则清空向量索引——dev/H2 create-drop 每次重建库，防止上一轮落盘向量变孤儿块。
    # 生产 mysql profile 在 application-mysql.yml 显式置 false。
    clean-on-empty-sources: true
  quota:
    signup-bonus-tokens: ${APP_SIGNUP_BONUS_TOKENS:100000} # 新用户赠200积分，存量不重置
    byok-token-divisor: 10                 # 每5000真实token扣1服务积分，调用后结算
    usage-estimate-enabled: true           # 厂商响应缺 usage 时按字符 1:1 估算兜底（false=不扣，仅记日志）
  platform-budget:
    daily-cny: ${APP_PLATFORM_DAILY_BUDGET_CNY:100}
    max-output-tokens: 32768
  security:
    # BYOK key 入库的 AES-256 KEK（Base64 编码 32 字节）。空=启动自动生成临时 key（重启后旧密文不可解）。
    # 生产/多实例必须显式设置同一 APP_DATA_KEY：
    #   PowerShell: [Convert]::ToBase64String((1..32 | ForEach-Object { Get-Random -Max 256 }))
    data-key: ${APP_DATA_KEY:}
