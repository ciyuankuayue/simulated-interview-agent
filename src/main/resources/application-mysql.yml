# MySQL 8 持久化 profile（生产 / Docker 起得来时）：
#   PowerShell（推荐）$env:SPRING_PROFILES_ACTIVE="mysql"; .\mvnw.cmd spring-boot:run
#   双 shell 通用      .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=mysql"
# 库名 mock_interview；createDatabaseIfNotExist 自动建库，省去手动建库。
# 账号/端口均可用环境变量覆盖；本机 docker-compose 默认 root/root@宿主 3307
# （宿主 3306 被原生 MySQL80 服务占用，容器映射 3307:3306；生产无冲突时 MYSQL_PORT=3306）。
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/mock_interview?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&characterEncoding=UTF-8
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update          # MVP：自动建/更表；上线前改 none + 迁移脚本
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

# ---- R4：MySQL 生产形态资料持久化，绝不因启动而清空向量索引 ----
# 索引目录建议显式指向挂载的持久卷（默认相对路径 data/rag-index 也可，只要容器挂了卷）。
app:
  rag:
    clean-on-empty-sources: false
    # index-dir: /app/data/rag-index   # Docker 部署时经 APP_RAG_INDEX_DIR 环境变量注入并挂卷
