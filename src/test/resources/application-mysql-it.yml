# R5-1 集成测试 profile：真实 MySQL 8（Docker 3307）+ Redis（6379）。
# 用法：@ActiveProfiles("mysql-it") 或 -Dspring.profiles.active=mysql-it。
# MySQL 不可达时 IT 类自动 skip（MysqlItSupport 探活），不阻断默认 H2 套件。
# 数据库 mock_interview_it 独立于 mock_interview，避免污染开发库。
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/mock_interview_it?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&characterEncoding=UTF-8
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  auth:
    jwt-enabled: true
  tenant:
    strict: true
  rag:
    ram-directory: false
    clean-on-empty-sources: false

jwt:
  secret: ${JWT_SECRET:r5-it-test-secret-at-least-32-bytes-long-0000}
