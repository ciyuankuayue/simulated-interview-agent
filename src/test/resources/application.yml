# 测试 profile：禁用 JWT（48 个旧测试全部无 JWT 断言）
# 注意：本文件整体遮蔽 src/main/resources/application.yml（classpath 同名文件 test 优先），
# 故主文件中关闭的 autoconfigure 开关在此也要显式关——Flyway 不得对 H2 跑 MySQL 方言脚本。
spring:
  flyway:
    enabled: false

app:
  launch:
    telemetry-enabled: false
    limits:
      enabled: false
  interview:
    # Historical suites exercise legacy sessions; dedicated Agent suites explicitly enable the new runtime.
    agent-enabled: false
  auth:
    jwt-enabled: false
  tenant:
    # R2-T0：测试非严格模式——线程缺 TenantContext 时回退兜底租户 0L（受过滤的普通租户，
    # isRoot(0L)=false，查询仍带 tenant_id=0 谓词），不允许静默跨租户。
    strict: false
  rag:
    # R4：测试套件因不同 @MockBean 组合会并存多个 Spring 上下文。统一用 ByteBuffersDirectory
    # 内存目录（每个上下文各自独立，走与生产相同的 Lucene 代码路径），避免多上下文争用同一
    # FSDirectory 的 write.lock；持久化能力由 POJO + @TempDir 的 LuceneVectorStoreTest 单独保证。
    ram-directory: true
    # 下方 index-dir 在 ram-directory=true 时不生效，仅作文档占位（生产默认 data/rag-index）。
    index-dir: target/rag-index-test
    # 测试资料库随上下文/用例变化，不能因"某次启动表为空"就清空索引，关闭启动清理。
    clean-on-empty-sources: false
