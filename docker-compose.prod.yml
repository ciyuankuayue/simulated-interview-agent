# 生产部署栈（与本地 docker-compose.yml 分离，互不干扰）
# 用法（在仓库根 /opt/app，需先 cp .env.example .env 并填好密钥）：
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# 网络设计：
#   backend  —— mysql / redis / app 三者内部互联（不暴露公网端口）
#   frontend —— caddy / app 互联（caddy 独占 80/443 对外）
#   app 同时挂两个网络，对外只走 caddy 反代，8080 不直接暴露。

services:
  mysql:
    image: mysql:8.0
    container_name: mock-interview-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: mock_interview
      MYSQL_ROOT_HOST: "%"                # 镜像初始化时建 root@%，否则默认只建 root@localhost，Docker 网段连库报 Host not allowed
      MYSQL_PWD: ${MYSQL_PASSWORD}        # 供 healthcheck 的 mysqladmin 读取，避免密码明文进命令行
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 30s
    networks:
      - backend
    # 不暴露宿主端口：仅内部访问（安全）。本地调试可临时加 "3306:3306"

  redis:
    image: redis:7-alpine
    container_name: mock-interview-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - backend

  app:
    build: .
    image: mock-interview-app:latest
    container_name: mock-interview-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      APP_DATA_KEY: ${APP_DATA_KEY}
      APP_RAG_INDEX_DIR: /app/data/rag-index
      # 4核4G 机器：JVM 锁 768M，给 mysql/redis/系统留足余量；2G 机器再调小
      JAVA_TOOL_OPTIONS: -Xmx768m -Xms512m -XX:+UseG1GC
    volumes:
      - rag_index:/app/data/rag-index
    networks:
      - backend
      - frontend
    # app 不直接暴露公网，只经 caddy 反代；调试时取消下面注释用 IP:8080 直连
    # ports:
    #   - "8080:8080"

  caddy:
    image: caddy:2-alpine
    container_name: mock-interview-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend

networks:
  backend:
  frontend:

volumes:
  mysql_data:
  redis_data:
  rag_index:
  caddy_data:
  caddy_config:
